<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalDesk: Research to Robinhood, with guardrails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;650;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14211F; --ink-2:#1D2E2B; --ink-3:#2A3F3B; --side-text:#C9D6D2; --side-dim:#8FA39E;
  --bg:#F3F5F4; --panel:#FFFFFF; --text:#16201E; --text-2:#55625F; --line:#DDE3E1; --line-2:#EBEFEE; --hover:#F6F8F7;
  --accent:#0E5E4F; --accent-2:#0A4A3E; --accentSoft:#E3F0EC;
  --good:#1B6B3A; --goodSoft:#E5F2E9; --warn:#946200; --warnSoft:#FBF1DC; --bad:#B42318; --badSoft:#FBE9E7; --info:#3E5C76; --infoSoft:#E8EEF3;
  --shadow:#7A8784; --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:6px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.grid2>*,.grid3>*{min-width:0}
.row>label.f{flex:1 1 130px;min-width:0}
#ticket,#ticket>*{min-width:0}
select,input{max-width:100%}
label.check{display:flex;gap:8px;align-items:flex-start;flex-wrap:nowrap}
label.check input{margin-top:3px;flex:none}
.row>label.f select,.row>label.f input{width:100%}
.side{background:var(--ink);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;border-bottom:1px solid var(--ink-3);margin-bottom:12px}
.brand svg{flex:none}
.brand b{display:block;color:#fff;font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;color:var(--side-dim);font-size:12px}
nav.tabs{display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto}
nav.tabs .grp{color:var(--side-dim);font-size:12px;font-weight:600;padding:14px 10px 6px}
nav.tabs button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--side-text);padding:8px 10px;border-radius:5px;cursor:pointer;font-weight:500;font-size:14px}
nav.tabs button svg{flex:none;opacity:.75}
nav.tabs button:hover{background:var(--ink-2);color:#fff}
nav.tabs button.on{background:var(--ink-3);color:#fff;box-shadow:inset 3px 0 0 #6FC2A9}
nav.tabs button.on svg{opacity:1}
.badge{margin-left:auto;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center}
.side-foot{border-top:1px solid var(--ink-3);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.mode{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 9px;border-radius:4px;border:1px solid var(--ink-3);color:var(--side-text)}
.mode.sim{color:#A9D3C6}.mode.dry{color:#F2C46B;border-color:#5C4A1F}.mode.live{color:#FF9C91;border-color:#6B2620}
/* the kill switch: the one deliberately loud control */
.kill{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:6px;border:1px solid #3B524D;background:var(--ink-2);color:#fff;cursor:pointer}
.kill:hover{border-color:#5C7A73}
.kill .led{width:10px;height:10px;border-radius:50%;background:#4FB38F;box-shadow:0 0 0 3px rgba(79,179,143,.18)}
.kill b{display:block;font-size:13px}
.kill small{display:block;color:var(--side-dim);font-size:11.5px}
.kill .state{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;background:#25403A;color:#A9D3C6}
.kill.on{background:#5A1712;border-color:#B42318}
.kill.on .led{background:#FF5A47;box-shadow:0 0 0 3px rgba(255,90,71,.25)}
.kill.on small{color:#F3B8B1}
.kill.on .state{background:#B42318;color:#fff}

.main-wrap{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:24px;padding:12px 32px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .where{font-size:13px;color:var(--text-2)}
.top .where b{color:var(--text);font-weight:600}
.kpis{display:flex;gap:28px;margin-left:auto}
.kpi{font-size:12px;color:var(--text-2)}
.kpi b{display:block;color:var(--text);font-size:16px;font-weight:600}
main{width:100%;max-width:1200px;padding:28px 32px 48px}
footer{margin-top:auto;color:var(--text-2);font-size:12.5px;padding:16px 32px 28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line-2)}

/* content */
h2{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0 0 4px}
.sub{color:var(--text-2);margin:0 0 20px;max-width:78ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px}
.panel h3{margin:0 0 12px;font-size:15px;font-weight:650}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12.5px;color:var(--text-2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:#F8FAF9;white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
.num{text-align:right}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--text-2)}
.small{font-size:12.5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:5px;padding:7px 13px;cursor:pointer;font-weight:500;line-height:1.3}
.btn:hover{background:var(--hover);border-color:#C9D2CF}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:#F0C7C2}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 13px;cursor:pointer;color:var(--text-2);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accentSoft);color:var(--accent);font-weight:600}
.chip{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;line-height:20px}
.chip.pass{background:var(--goodSoft);color:var(--good)}
.chip.warn{background:var(--warnSoft);color:var(--warn)}
.chip.block{background:var(--badSoft);color:var(--bad)}
.chip.info{background:var(--infoSoft);color:var(--info)}
.chip.mutedc{background:var(--line-2);color:var(--text-2)}
.chip.shadow{background:#fff;color:#4B5754;border:1px dashed var(--shadow)}
.scorebar{height:6px;background:var(--line-2);border-radius:3px;width:88px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.scorebar i{display:block;height:100%;background:var(--accent)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text-2);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid #CDD5D2;border-radius:5px;padding:7px 10px;background:#fff;min-width:0;font-weight:400;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accentSoft);border-color:var(--accent)}
textarea{resize:vertical}
input.cell{width:76px;padding:4px 7px;font-size:12.5px}
.banner{padding:11px 14px;border-radius:5px;background:var(--warnSoft);color:#5E4300;font-size:13px;margin-bottom:16px;border-left:3px solid var(--warn)}
.banner.info{background:var(--accentSoft);color:#0B3F35;border-left-color:var(--accent)}
.banner.bad{background:var(--badSoft);color:#7A1A12;border-left-color:var(--bad)}
.rules td{padding:8px 10px}
td.why{font-size:12.5px;min-width:220px}
@media(max-width:1560px){table.rank-tbl th:nth-child(8),table.rank-tbl td:nth-child(8),table.rank-tbl th:nth-child(9),table.rank-tbl td:nth-child(9){display:none}table.rank-tbl th,table.rank-tbl td{padding-left:6px;padding-right:6px}table.rank-tbl td.why{min-width:190px}}
@media(max-width:1180px){table.rank-tbl th:nth-child(10),table.rank-tbl td:nth-child(10){display:none}}
.why .plus{color:var(--good)}.why .minus{color:var(--warn)}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;background:#fff}
.card h4{margin:0 0 4px;font-size:14.5px;font-weight:650}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px}
.kv div:nth-child(odd){color:var(--text-2)}
.modal-bg{position:fixed;inset:0;background:rgba(20,33,31,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:8px;max-width:600px;width:100%;max-height:90vh;overflow:auto;padding:24px;border:1px solid var(--line)}
.modal h3{margin:0 0 14px;font-size:17px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;z-index:30;max-width:380px}
.toast.on{opacity:1;transform:none}
.empty{color:var(--text-2);padding:20px;text-align:center;font-size:13px}
.flex1{flex:1}
.right{margin-left:auto}
.star{cursor:pointer;border:0;background:none;font-size:16px;color:#C3CBC8;padding:0}
.star.on{color:#C99A06}
pre.code{background:var(--ink);color:#DDE7E4;border-radius:6px;padding:12px;font-family:var(--mono);font-size:11.5px;overflow:auto;max-height:220px;white-space:pre-wrap;word-break:break-all}
details summary{cursor:pointer}

@media(max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .kpis{flex-wrap:wrap}
  .panel{padding:14px}
  .panel{overflow-x:auto}
  .side{position:static;height:auto;padding:12px}
  .brand{border:0;padding-bottom:8px;margin-bottom:4px}
  nav.tabs{flex-direction:row;overflow-x:auto;gap:4px}
  nav.tabs .grp{display:none}
  nav.tabs button{width:auto;white-space:nowrap}
  .side-foot{flex-direction:row;align-items:center;border:0;padding-top:8px}
  .kill{width:auto}
  .top{position:static;padding:10px 16px;flex-wrap:wrap}
  .kpis{margin-left:0;gap:18px}
  main{padding:20px 16px 40px}
  footer{padding:14px 16px 24px}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="6" fill="#0E5E4F"/><path d="M8 19.5c1.4 1.2 3.4 1.9 5.4 1.9 3 0 5-1.4 5-3.6 0-4.7-9.6-2.6-9.6-7 0-2 1.9-3.4 4.6-3.4 1.8 0 3.4.5 4.7 1.4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="22.5" cy="20.5" r="2.2" fill="#6FC2A9"/></svg>
      <div><b>SignalDesk</b><span>Trust and risk console</span></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="side-foot">
      <span class="mode" id="k-mode">Simulation</span>
      <button class="kill" id="k-kill" onclick="toggleKill()" aria-label="Kill switch"></button>
    </div>
  </aside>
  <div class="main-wrap">
    <header class="top">
      <div class="where" id="k-where"></div>
      <div class="kpis">
        <div class="kpi">Portfolio<b id="k-port">–</b></div>
        <div class="kpi">Buying power<b id="k-bp">–</b></div>
        <div class="kpi">Open cases<b id="k-cases">0</b></div>
      </div>
    </header>
    <main id="view"></main>
    <footer><span>Scores show how well an asset fits your research style. They are not predicted returns or buy recommendations.</span><button class="btn sm" onclick="resetDemo()">Reset demo data</button></footer>
  </div>
</div>

<div class="modal-bg" id="modal"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- environment ---------- */
const TOKEN = '__SIGNALDESK_TOKEN__';
const ON_BRIDGE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') && !TOKEN.startsWith('__');
const LS_KEY = 'signaldesk_v1';
const DAY = 864e5;

/* ---------- sample research inputs (illustrative, editable) ---------- */
const ASSET_DEFAULTS = [
  {sym:'BTC', name:'Bitcoin',   price:68000, spread:0.05, ret30:6,  vol:45, dd:-12, liqB:30,  unlock:'none', security:'ok'},
  {sym:'ETH', name:'Ethereum',  price:3400,  spread:0.07, ret30:9,  vol:55, dd:-18, liqB:15,  unlock:'none', security:'ok'},
  {sym:'SOL', name:'Solana',    price:160,   spread:0.15, ret30:14, vol:75, dd:-28, liqB:4,   unlock:'med',  security:'ok'},
  {sym:'XRP', name:'XRP',       price:0.55,  spread:0.20, ret30:-3, vol:70, dd:-25, liqB:2.5, unlock:'low',  security:'ok'},
  {sym:'ADA', name:'Cardano',   price:0.45,  spread:0.30, ret30:-6, vol:72, dd:-35, liqB:0.6, unlock:'low',  security:'ok'},
  {sym:'AVAX',name:'Avalanche', price:30,    spread:0.40, ret30:4,  vol:80, dd:-38, liqB:0.5, unlock:'high', security:'ok'},
  {sym:'LINK',name:'Chainlink', price:15,    spread:0.35, ret30:11, vol:70, dd:-26, liqB:0.7, unlock:'med',  security:'watch'}
];
const STYLES = {
  balanced:{label:'Balanced',        w:{mom:.30, liq:.25, risk:.20, supply:.15, sec:.10}},
  momentum:{label:'Momentum',        w:{mom:.50, liq:.25, risk:.10, supply:.10, sec:.05}},
  lowvol:  {label:'Lower volatility',w:{mom:.10, liq:.25, risk:.45, supply:.10, sec:.10}}
};
const FACTOR_NAMES = {mom:'Momentum vs BTC', liq:'Liquidity', risk:'Volatility & drawdown', supply:'Supply / unlocks', sec:'Security flags'};

function defaultRules(){
  return [
    {id:'kill',     name:'Kill switch',            cat:'Global',   mode:'enforce', enabled:true, locked:true, desc:'Halts every order and cancels open ones.'},
    {id:'signals',  name:'Outside risk signals',   cat:'Signals',  mode:'enforce', enabled:true, param:70, param2:40, desc:'Combined account risk from device and login, identity, blockchain and scam signals.', unit:'account risk score out of 100'},
    {id:'chain', name:'Blockchain analytics', cat:'Signals', mode:'enforce', enabled:true, param:60, param2:25, desc:'Screens wallets whenever crypto moves in or out: deposits from outside wallets and withdrawals to new addresses, plus wallets linked to your account. Sanctioned exposure always blocks.', unit:'exposure score out of 100'},
    {id:'wd_addr',  name:'New address hold',       cat:'Transfers',mode:'enforce', enabled:true, param:24,   desc:'Withdrawals only go to saved addresses, and a new one waits before it can be used. Stops a hijacked session from adding an address and cashing out.', unit:'hours a new withdrawal address waits before it can be used'},
    {id:'wd_security',name:'Security change hold', cat:'Transfers',mode:'enforce', enabled:true, param:24,   desc:'Pauses withdrawals after a new device or a 2FA, password or email change. That\'s when a takeover is most likely.', unit:'hours withdrawals pause after a new device, 2FA, password or email change'},
    {id:'wd_cap',   name:'Daily withdrawal cap',   cat:'Transfers',mode:'enforce', enabled:true, param:2000, desc:'Limits how much can leave the account in a day, so one bad session can\'t empty it.', unit:'USD of withdrawals in a rolling 24h'},
    {id:'thesis',   name:'Thesis is current',      cat:'Thesis',   mode:'enforce', enabled:true, desc:'Buys need a linked thesis inside its review date with no fired risk trigger.'},
    {id:'funds',    name:'Buying power / holdings',cat:'Account',  mode:'enforce', enabled:true, desc:'Buys must fit buying power; sells must fit holdings.'},
    {id:'position', name:'Position limit',         cat:'Exposure', mode:'enforce', enabled:true, param:20,   unit:'% of total portfolio after the trade'},
    {id:'size',     name:'Order size cap',         cat:'Exposure', mode:'enforce', enabled:true, param:1000, unit:'USD per order. Warn above, Block at 2×'},
    {id:'daily',    name:'Daily spend cap',        cat:'Exposure', mode:'enforce', enabled:true, param:2500, unit:'USD of buys in a rolling 24h'},
    {id:'velocity', name:'Velocity / duplicate',   cat:'Trading',  mode:'enforce', enabled:true, param:3,    unit:'orders per symbol in 10 min (more is blocked)'},
    {id:'deviation',name:'Price deviation',        cat:'Trading',  mode:'enforce', enabled:true, param:2,    unit:'% limit price away from live quote (Warn)'},
    {id:'spread',   name:'Spread guard',           cat:'Trading',  mode:'enforce', enabled:true, param:1,    unit:'% bid/ask spread; market orders blocked above'},
    {id:'fit',      name:'Research fit',           cat:'Research', mode:'shadow',  enabled:true, param:4,    unit:'worst rank allowed for buys under current style (Warn)'},
    {id:'quiet',    name:'Quiet hours',            cat:'Behavior', mode:'enforce', enabled:true, param:23, param2:6, unit:'local hours, start to end (Warn)'}
  ];
}
function seedHistory(){
  // Earlier activity in this browser profile, Aug to Oct 2026.
  let r = 20260804; const rnd = () => (r = (r*1103515245 + 12345) % 2147483648) / 2147483648;
  const at = (m, d) => new Date(2026, m-1, d, 7 + Math.floor(rnd()*15), Math.floor(rnd()*60)).getTime();
  const E = [
    [8,4,'settings','Rule "Max order size" set to $1,000 (tightened, applied immediately)'],
    [8,4,'thesis','Thesis created for BTC: core holding, add on pullbacks'],
    [8,6,'key','Robinhood API key registered; private key stays on this device'],
    [8,9,'check','O-1001 buy 0.005 BTC limit: passed (0 warn, 0 shadow)','O-1001','kill:pass signals:pass funds:pass size:pass daily:pass'],
    [8,9,'confirm','O-1001 confirmed by user','O-1001'],
    [8,9,'fill','O-1001 filled 0.005 BTC @ $61,240','O-1001'],
    [8,14,'thesis','Thesis created for ETH: staking yield and L2 growth'],
    [8,19,'check','O-1002 buy 1.2 ETH limit: BLOCKED (1 warn, 0 shadow)','O-1002','size:block spread:warn'],
    [8,19,'case','Case opened: O-1002 blocked by Max order size','O-1002'],
    [8,20,'case','Case resolved: sized down, rule working as intended','O-1002'],
    [8,27,'settings','Requested loosening "Daily loss limit" to $500; held for 24-hour cooldown'],
    [8,28,'settings','Cooldown ended; "Daily loss limit" change applied'],
    [9,3,'signals','Login from a new device: on'],
    [9,3,'security','Step-up code verified for order O-1003','O-1003'],
    [9,3,'signals','Login from a new device: off (confirmed as own laptop)'],
    [9,11,'check','O-1004 buy 4 SOL limit: passed (1 warn, 0 shadow)','O-1004','velocity:pass deviation:warn'],
    [9,11,'order','O-1004 cancelled before sending','O-1004'],
    [9,18,'reconcile','Reconciliation run: 0 mismatches'],
    [9,24,'kill','Kill switch ON during market swing'],
    [9,24,'kill','Kill switch off'],
    [10,2,'research','Research style changed to Lower volatility'],
    [10,8,'check','O-1005 buy 0.003 BTC limit: passed (0 warn, 0 shadow)','O-1005','kill:pass signals:pass size:pass'],
    [10,8,'fill','O-1005 filled 0.003 BTC @ $63,910','O-1005'],
    [10,15,'anomaly','Order velocity limit hit on BTC'],
    [10,15,'case','Case opened: velocity anomaly on BTC'],
    [10,16,'case','Case resolved: duplicate clicks, no order sent'],
    [10,22,'settings','Rule "Outside risk signals" moved from shadow to enforce'],
    [10,29,'reconcile','Reconciliation run: 0 mismatches'],
  ];
  return E.map(([m,d,type,detail,orderId,rules]) => ({ts:at(m,d), type, detail, ...(orderId?{orderId}:{}), ...(rules?{rules}:{}), seeded:true}))
          .sort((a,b)=>b.ts-a.ts);
}
function redateEntries(){
  // Spread entries that all landed on one day across Aug to early Nov 2026, keeping each order's steps together.
  const mine = S.audit.filter(a=>!a.seeded).sort((a,b)=>a.ts-b.ts);
  if(!mine.length) return;
  const groups = []; let g = null;
  for(const a of mine){
    const same = g && ((a.orderId && a.orderId===g.orderId) || (!a.orderId && a.ts - g.last < 60000));
    if(!same){ g = {items:[], orderId:a.orderId, first:a.ts, last:a.ts}; groups.push(g); }
    g.items.push(a); g.last = a.ts; if(a.orderId) g.orderId = a.orderId;
  }
  let r = 7351; const rnd = () => (r = (r*1103515245 + 12345) % 2147483648) / 2147483648;
  const start = new Date(2026,7,5).getTime(), end = new Date(2026,10,3).getTime();
  const days = groups.map(()=> start + rnd()*(end-start)).sort((a,b)=>a-b);
  const tsMap = new Map();
  groups.forEach((grp,i)=>{
    const d = new Date(days[i]); d.setHours(8 + Math.floor(rnd()*13), Math.floor(rnd()*60), 0, 0);
    grp.items.forEach(a=>{ const nt = d.getTime() + (a.ts - grp.first); tsMap.set(a.ts, nt); a.ts = nt; });
  });

/* ---------- research scoring ---------- */
function computeScores(){
  const style = STYLES[S.style];
  const btc = S.assets.find(a=>a.sym==='BTC');
  const raw = S.assets.map(a => ({
    sym:a.sym,
    mom: a.ret30 - (btc?btc.ret30:0),
    liq: Math.log10(Math.max(a.liqB, 0.001)),
    risk: -(a.vol/100) + (a.dd/100),
    supply: {none:100, low:75, med:40, high:10}[a.unlock] ?? 50,
    sec: a.security==='ok' ? 100 : 40
  }));
  const keys = Object.keys(style.w);
  const norm = {};
  keys.forEach(k => {
    const vals = raw.map(r=>r[k]); const lo = Math.min(...vals), hi = Math.max(...vals);
    raw.forEach(r => { norm[r.sym] = norm[r.sym]||{}; norm[r.sym][k] = hi===lo ? 50 : (r[k]-lo)/(hi-lo)*100; });
  });
  const out = S.assets.map(a => {
    const n = norm[a.sym]; let score = 0; keys.forEach(k => score += n[k]*style.w[k]);
    const contrib = keys.map(k => ({k, v:n[k], w:style.w[k]}));
    const best = contrib.slice().sort((x,y)=>y.v*y.w - x.v*x.w)[0];
    const worst = contrib.filter(c=>c.w>=0.1).sort((x,y)=>x.v-y.v)[0];
    return {a, score:Math.round(score), n, best, worst, relMom:raw.find(r=>r.sym===a.sym).mom};
  }).sort((x,y)=>y.score-x.score);
  out.forEach((r,i)=>r.rank=i+1);
  return out;
}
function factorText(k, a, rel, good){
  switch(k){
    case 'mom': return a.sym==='BTC' ? 'Momentum benchmark (BTC)' : rel > 0 ? `Beating BTC by ${rel.toFixed(0)} pts over 30 days` : rel < 0 ? `Lagging BTC by ${Math.abs(rel).toFixed(0)} pts over 30 days` : 'Level with BTC over 30 days';
    case 'liq': return good ? `Deep liquidity ($${a.liqB}B 24h volume)` : `Thin liquidity ($${a.liqB}B 24h volume)`;
    case 'risk': return good ? `Lower volatility (${a.vol}% annualized)` : `Elevated volatility (${a.vol}%) and ${a.dd}% drawdown`;
    case 'supply': return good ? (a.unlock==='none'?'No token unlock flagged':`Unlock risk only ${a.unlock}`) : `Token unlock risk: ${a.unlock}`;
    case 'sec': return good ? 'No security flags entered' : 'Security flag: watch';
  }
}

/* ---------- theses ---------- */
function thesisStatus(t){
  const q = M[t.sym]; const fired = (t.triggers||[]).filter(tr => q && (tr.kind==='below' ? q.mid < tr.price : q.mid > tr.price));
  if(fired.length) return {code:'trigger', label:'Risk trigger fired', cls:'block', fired};
  if(t.review < today()) return {code:'review', label:'Review due', cls:'warn', fired:[]};
  return {code:'current', label:'Current', cls:'pass', fired:[]};
}
const firedSeen = new Set();
function evaluateTriggers(){
  S.theses.forEach(t => { const st = thesisStatus(t); st.fired.forEach(f => { const key = t.id+f.kind+f.price; if(!firedSeen.has(key)){ firedSeen.add(key); logAudit('thesis', `Risk trigger fired on ${t.sym} thesis ${t.id}: price ${f.kind} ${px(f.price)}`); } }); });
}

/* ---------- rules engine ---------- */
function evaluateOrder(o){
  const R = [];
  const q = M[o.sym];
  const ranked = computeScores();
  const rank = (ranked.find(r=>r.a.sym===o.sym)||{}).rank;
  const notional = o.notional;
  const add = (id, outcome, detail) => { const r = rule(id); if(!r) return; if(!r.enabled){ R.push({id, name:r.name, outcome:'skip', detail:'Rule disabled', shadow:false}); return; } R.push({id, name:r.name, outcome, detail, shadow: r.mode==='shadow' && outcome!=='pass'}); };

  add('kill', S.kill ? 'block' : 'pass', S.kill ? 'Kill switch is on' : 'Trading enabled');
  { const r = rule('chain'); if(r){ const v = S.signals.vendors.chain;
      if(v && v.status==='down') add('chain', v.mode==='closed' ? 'block' : 'pass', v.mode==='closed' ? 'Blockchain analytics unavailable (fail-closed)' : 'Blockchain analytics unavailable; continued fail-open');
      else if(S.signals.events.sanctioned) add('chain','block','Exposure to a sanctioned address. Hard stop; needs compliance review.');
      else { const sc = vendorScore('chain'); add('chain', sc >= r.param ? 'block' : sc >= r.param2 ? 'warn' : 'pass', `Wallet exposure ${sc}/100 (warn ${r.param2}, block ${r.param})`); } } }
  { const r = rule('signals'); if(r){ const sum = signalSummary();
      const closedDown = sum.down.filter(v => S.signals.vendors[v.id].mode==='closed'), openDown = sum.down.filter(v => S.signals.vendors[v.id].mode==='open');
      if(closedDown.length) add('signals','block', `${closedDown.map(v=>v.name).join(', ')} unavailable (fail-closed)`);
      else add('signals', sum.score >= r.param ? 'block' : sum.score >= r.param2 ? 'warn' : 'pass', `Account risk ${sum.score}/100 (warn ${r.param2}, block ${r.param})${openDown.length ? '; ' + openDown.map(v=>v.name).join(', ') + ' unavailable, continued fail-open' : ''}`); } }

  if(o.side==='buy'){
    const t = S.theses.find(t=>t.id===o.thesisId);
    if(!t) add('thesis','block','No thesis linked to this buy');
    else { const st = thesisStatus(t); add('thesis', st.code==='current'?'pass':'block', st.code==='current' ? `Thesis ${t.id} is current (review ${t.review})` : `Thesis ${t.id}: ${st.label}`); }
  } else add('thesis','pass','Sells do not need a thesis');

  if(o.side==='buy') add('funds', notional <= S.cash ? 'pass':'block', `Needs ${usd(notional)} of ${usd(S.cash)} buying power`);
  else { const have = S.holdings[o.sym]||0; add('funds', o.qty <= have ? 'pass':'block', `Selling ${qty(o.qty)} of ${qty(have)} ${o.sym} held`); }

  { const r = rule('position'); const posAfter = ((S.holdings[o.sym]||0) + (o.side==='buy'?o.qty:-o.qty)) * q.mid; const share = posAfter / portfolioValue() * 100;
    add('position', o.side==='sell' || share <= r.param ? 'pass':'block', `${o.sym} would be ${share.toFixed(1)}% of portfolio (limit ${r.param}%)`); }

  { const r = rule('size'); const out = notional > 2*r.param ? 'block' : notional > r.param ? 'warn' : 'pass';
    add('size', out, `${usd(notional)} vs cap ${usd(r.param,0)}`); }

  if(o.side==='buy'){ const r = rule('daily'); const spent = S.orders.filter(x => x.id!==o.id && x.side==='buy' && x.ts > Date.now()-DAY && ['filled','open','submitted','dry-run'].includes(x.status)).reduce((s,x)=>s+x.notional,0);
    add('daily', spent + notional <= r.param ? 'pass':'block', `${usd(spent)} spent in 24h + ${usd(notional)} vs cap ${usd(r.param,0)}`); }
  else add('daily','pass','Sells do not count');

  { const r = rule('velocity'); const n = S.orders.filter(x => x.id!==o.id && x.sym===o.sym && x.ts > Date.now()-10*60e3).length;
    add('velocity', n < r.param ? 'pass':'block', `${n} ${o.sym} order attempts in last 10 min (limit ${r.param})`); }

  if(o.type==='limit'){ const r = rule('deviation'); const ref = o.side==='buy' ? q.ask : q.bid; const dev = (o.limit - ref)/ref*100;
    add('deviation', Math.abs(dev) <= r.param ? 'pass':'warn', `Limit ${px(o.limit)} is ${pct(dev,2)} from ${o.side==='buy'?'ask':'bid'} ${px(ref)}`); }
  else add('deviation','pass','Market order: checked by spread guard');

  { const r = rule('spread'); add('spread', o.type==='market' && q.spread > r.param ? 'block':'pass', `Spread ${q.spread.toFixed(2)}% (guard ${r.param}%${o.type==='market'?'':'; limit order'})`); }

  if(o.side==='buy'){ const r = rule('fit'); add('fit', rank <= r.param ? 'pass':'warn', `${o.sym} ranks #${rank} of ${S.assets.length} under ${STYLES[S.style].label} (cutoff #${r.param})`); }
  else add('fit','pass','Not applied to sells');

  { const r = rule('quiet'); const h = new Date().getHours(); const inQuiet = r.param > r.param2 ? (h >= r.param || h < r.param2) : (h >= r.param && h < r.param2);
    add('quiet', inQuiet ? 'warn':'pass', `Local hour ${h}:00; quiet ${r.param}:00 to ${r.param2}:00`); }

  const enforcedBlocks = R.filter(r => r.outcome==='block' && !r.shadow);
  const enforcedWarns = R.filter(r => r.outcome==='warn' && !r.shadow);
  return {results:R, rank, blocked:enforcedBlocks.length>0, warns:enforcedWarns, blocks:enforcedBlocks};
}

/* ---------- step-up ---------- */
let stepCode = null;
function needsStepUp(o){ return o.notional > rule('size').param || (Date.now() - S.settingsChangedAt) < DAY; }

/* ---------- order flow ---------- */
let draft = null;
function buildDraft(form){
  const sym = form.sym.value, side = form.side.value, type = form.type.value;
  const qn = parseFloat(form.qty.value); const limit = parseFloat(form.limit.value);
  if(!(qn>0)) { toast('Enter a quantity above zero'); return null; }
  if(type==='limit' && !(limit>0)) { toast('Enter a limit price'); return null; }
  const q = M[sym]; const priceUsed = type==='limit' ? limit : (side==='buy'?q.ask:q.bid);
  return {sym, side, type, qty:qn, limit: type==='limit'?limit:null, notional: qn*priceUsed, thesisId: form.thesis.value || null};
}
function runChecks(){
  const o = buildDraft($('ticket')); if(!o) return;
  const ev = evaluateOrder(o);
  const order = {...o, id:'O'+(S.seq.order++), clientOrderId:uuid(), ts:Date.now(), rank:ev.rank, results:ev.results, status: ev.blocked ? 'blocked' : 'checked', mode: liveMode() ? (bridge.status.dry_run?'dry-run':'live') : 'sim'};
  S.orders.unshift(order);
  logAudit('check', `${order.id} ${o.side} ${qty(o.qty)} ${o.sym} ${o.type}: ${ev.blocked?'BLOCKED':'passed'} (${ev.warns.length} warn, ${ev.results.filter(r=>r.shadow).length} shadow)`, {orderId:order.id, rules:ev.results.map(r=>r.id+':'+r.outcome+(r.shadow?'(shadow)':'')).join(' ')});
  if(ev.blocked){
    openCase('Blocked order', `${order.id}: ${o.side} ${qty(o.qty)} ${o.sym} blocked by ${ev.blocks.map(b=>b.name).join(', ')}`, {orderId:order.id});
    if(ev.blocks.some(b=>b.id==='velocity')) recordAnomaly('Order velocity limit hit on ' + o.sym, 'Possible runaway script or repeated clicks.');
  }
  prefill = {sym:o.sym, side:o.side, type:o.type, qty:o.qty, limit:o.limit, thesis:o.thesisId};
  draft = order; save(); render();
  if(!ev.blocked) openConfirm(order);
}
function openConfirm(order){
  const ev = evaluateOrder(order);
  const step = needsStepUp(order);
  if(step) stepCode = String(Math.floor(100000 + Math.random()*900000));
  const warns = ev.warns.map((w,i)=>`<label class="check small" style="margin:6px 0"><input type="checkbox" class="ack" data-i="${i}"> <span><span class="chip warn">Warn</span> <b>${esc(w.name)}</b>: ${esc(w.detail)}</span></label>`).join('');
  openModal(`<h3>Confirm order ${order.id}</h3>
    <div class="kv" style="margin-bottom:12px">
      <div>Order</div><div><b>${order.side.toUpperCase()} ${qty(order.qty)} ${order.sym}</b>, ${order.type}${order.limit?' @ '+px(order.limit):''}</div>
      <div>Estimated value</div><div>${usd(order.notional)}</div>
      <div>Thesis</div><div>${order.thesisId ? esc(order.thesisId) : '<span class="muted">none</span>'}</div>
      <div>Research rank</div><div>#${ev.rank} under ${STYLES[S.style].label}</div>
      <div>Sends to</div><div>${liveMode() ? (bridge.status.dry_run ? 'Local bridge (dry run, not sent to Robinhood)' : '<b style="color:var(--bad)">Robinhood, LIVE</b>') : 'Simulated broker'}</div>
    </div>
    ${warns ? '<div class="small muted">Acknowledge each warning to continue:</div>'+warns : '<div class="chip pass">All enforced rules passed</div>'}
    ${step ? `<div class="panel" style="margin-top:12px;background:var(--soft)"><b class="small">Step-up confirmation</b><div class="small muted">${order.notional > rule('size').param ? 'Order is above your size cap.' : 'Your rule settings changed in the last 24 hours.'} Enter the code from your authenticator.</div><div class="row" style="margin-top:8px"><input type="text" id="stepcode" inputmode="numeric" maxlength="6" placeholder="6-digit code" style="width:140px"><span class="small muted">Authenticator code (simulation): <span class="mono">${stepCode}</span></span></div></div>` : ''}
    <div class="row" style="margin-top:16px"><button class="btn primary" onclick="confirmOrder('${order.id}', ${step})">Confirm and send</button><button class="btn" onclick="cancelDraft('${order.id}')">Cancel</button></div>`);
}
function cancelDraft(id){ const o = S.orders.find(x=>x.id===id); if(o && o.status==='checked'){ o.status='cancelled'; logAudit('order', `${id} cancelled before sending`, {orderId:id}); save(); } closeModal(); render(); }
async function confirmOrder(id, step){
  const o = S.orders.find(x=>x.id===id); if(!o) return;
  const acks = [...document.querySelectorAll('.ack')]; if(acks.some(a=>!a.checked)){ toast('Acknowledge every warning first'); return; }
  if(step){ const v = ($('stepcode')||{}).value; if(v !== stepCode){ toast('Step-up code does not match'); logAudit('security', `${id}: step-up code failed`, {orderId:id}); save(); return; } }
  const ev = evaluateOrder(o); if(ev.blocked){ o.status='blocked'; o.results = ev.results; openCase('Blocked order', `${o.id}: conditions changed before confirmation`, {orderId:o.id}); save(); closeModal(); render(); return; }
  o.confirmedAt = Date.now(); o.ackWarnings = ev.warns.map(w=>w.id); o.stepUp = !!step;
  logAudit('confirm', `${id} confirmed${step?' with step-up':''}${o.ackWarnings.length?'; acknowledged '+o.ackWarnings.join(', '):''}`, {orderId:id});
  closeModal();
  await submitOrder(o);
}
async function submitOrder(o){
  o.status = 'submitted'; save(); render();
  if(liveMode()){
    try{
      const r = await api('POST','/api/orders', {client_order_id:o.clientOrderId, symbol:o.sym+'-USD', side:o.side, type:o.type, asset_quantity:String(o.qty), limit_price:o.limit!=null?String(o.limit):null, notional_usd:o.notional, signaldesk_order_id:o.id});
      if(r.dry_run){ o.status='dry-run'; o.brokerId = r.order && r.order.id; o.preview = r.request_preview; logAudit('order', `${o.id} dry run: signed request built, not sent`, {orderId:o.id}); }
      else { o.brokerId = r.order.id; o.status = mapState(r.order.state); applyLiveFill(o, r.order); logAudit('order', `${o.id} sent to Robinhood as ${o.brokerId} (${r.order.state})`, {orderId:o.id}); }
    }catch(e){
      o.status = 'failed'; o.error = e.message; logAudit('order', `${o.id} failed: ${e.message}`, {orderId:o.id});
      if(e.status===401) recordAnomaly('Signature rejected (401)', 'Robinhood rejected the request signature. Check or revoke the key.');
      if(e.status===429) logAudit('bridge','Rate limited by Robinhood (429); bridge backed off');
      openCase('Failed order', `${o.id}: ${e.message}`, {orderId:o.id});
    }
    save(); render(); return;
  }
  // simulated broker
  await new Promise(r=>setTimeout(r, 900));
  o.brokerId = 'sim-' + o.clientOrderId.slice(0,8);
  S.broker.orders[o.brokerId] = {id:o.brokerId, client_order_id:o.clientOrderId, symbol:o.sym, side:o.side, qty:o.qty, filled:0, state:'open'};
  o.status = 'open'; logAudit('order', `${o.id} accepted by simulated broker as ${o.brokerId}`, {orderId:o.id});
  fillOpenSimOrders(); save(); render();
}
function mapState(s){ return ({filled:'filled', open:'open', partially_filled:'open', canceled:'cancelled', cancelled:'cancelled', failed:'failed'})[s] || s || 'submitted'; }
function applyLiveFill(o, bo){ if(bo.filled_asset_quantity!=null) o.filledQty = +bo.filled_asset_quantity; if(bo.average_price!=null) o.avgPrice = +bo.average_price; }
function fillOpenSimOrders(){
  S.orders.filter(o => o.status==='open' && o.mode==='sim').forEach(o => {
    const q = M[o.sym]; const crosses = o.type==='market' || (o.side==='buy' ? o.limit >= q.ask : o.limit <= q.bid);
    if(!crosses) return;
    const price = o.type==='market' ? (o.side==='buy'?q.ask:q.bid) : o.limit;
    if(o.side==='buy' && S.cash < o.qty*price){ return; }
    o.status='filled'; o.filledQty=o.qty; o.avgPrice=price; o.filledAt=Date.now();
    const sign = o.side==='buy'?1:-1;
    S.holdings[o.sym] = +( (S.holdings[o.sym]||0) + sign*o.qty ).toFixed(10);
    S.cash -= sign*o.qty*price;
    const bo = S.broker.orders[o.brokerId]; if(bo){ bo.filled = o.qty; bo.state='filled'; bo.avg = price; }
    S.broker.holdings[o.sym] = +((S.broker.holdings[o.sym]||0) + sign*o.qty).toFixed(10);
    logAudit('fill', `${o.id} filled ${qty(o.qty)} ${o.sym} @ ${px(price)}`, {orderId:o.id});
    const fills = S.orders.filter(x=>x.status==='filled' && x.id!==o.id).map(x=>x.notional).sort((a,b)=>a-b);
    if(fills.length>=3){ const med = fills[Math.floor(fills.length/2)]; if(o.notional > 3*med) recordAnomaly('Order outside your normal size', `${o.id} is ${(o.notional/med).toFixed(1)}× your median order.`); }
  });
  save();
}
async function cancelOrder(id){
  const o = S.orders.find(x=>x.id===id); if(!o) return;
  if(o.mode!=='sim' && liveMode() && o.brokerId){ try{ await api('POST', `/api/orders/${encodeURIComponent(o.brokerId)}/cancel`); }catch(e){ toast('Cancel failed: '+e.message); return; } }
  if(S.broker.orders[o.brokerId]) S.broker.orders[o.brokerId].state='cancelled';

}

/* ---------- reconciliation ---------- */
async function reconcile(){
  const issues = [];
  if(liveMode()){
    for(const o of S.orders.filter(o=>o.mode==='live' && o.brokerId && ['open','submitted'].includes(o.status))){
      try{ const bo = await api('GET', `/api/orders/${encodeURIComponent(o.brokerId)}`); const st = mapState(bo.state); if(st!==o.status){ logAudit('reconcile', `${o.id} status ${o.status} → ${st}`, {orderId:o.id}); o.status = st; } applyLiveFill(o, bo); }
      catch(e){ issues.push(`${o.id}: could not read status (${e.message})`); }
    }
    await syncLiveAccount();
  } else {
    S.orders.filter(o=>o.mode==='sim' && o.brokerId).forEach(o => {
      const bo = S.broker.orders[o.brokerId];
      if(!bo) issues.push(`${o.id}: no matching broker order`);
      else if(o.status==='filled' && Math.abs(bo.filled - o.filledQty) > 1e-12) issues.push(`${o.id}: SignalDesk shows ${qty(o.filledQty)} filled, broker shows ${qty(bo.filled)}`);
    });
    const known = new Set(S.orders.map(o=>o.brokerId));
    Object.values(S.broker.orders).forEach(bo => { if(!known.has(bo.id)) issues.push(`Broker order ${bo.id} (${bo.side} ${qty(bo.qty)} ${bo.symbol}) was not created by SignalDesk`); });
    const syms = new Set([...Object.keys(S.holdings), ...Object.keys(S.broker.holdings)]);
    syms.forEach(s => { const a = S.holdings[s]||0, b = S.broker.holdings[s]||0; if(Math.abs(a-b) > 1e-9) issues.push(`${s} holdings: SignalDesk ${qty(a)} vs broker ${qty(b)}`); });
  }
  S.lastRecon = {ts:Date.now(), issues};
  logAudit('reconcile', issues.length ? `${issues.length} break(s) found` : 'All orders and holdings match');
  if(issues.length){
    openCase('Reconciliation break', issues.join('; '), {});
    if(issues.some(i=>i.includes('not created by SignalDesk'))) recordAnomaly('Unknown broker order', 'An order exists at the broker that SignalDesk did not send. Possible key misuse: consider revoking the execution key.');
  }
  save(); render(); toast(issues.length ? `${issues.length} reconciliation break(s): case opened` : 'Reconciled: everything matches');
}
function injectMismatch(kind){
  if(kind==='unknown'){ const id = 'sim-ext-' + rnd4(); S.broker.orders[id] = {id, client_order_id:'unknown', symbol:'SOL', side:'buy', qty:5, filled:5, state:'filled'}; S.broker.holdings.SOL = (S.broker.holdings.SOL||0)+5; toast('Injected an order SignalDesk did not send'); }
  else { const o = S.orders.find(o=>o.status==='filled' && o.mode==='sim'); if(!o){ toast('Fill a simulated order first'); return; } S.broker.orders[o.brokerId].filled = o.filledQty/2; toast(`Broker now shows a partial fill for ${o.id}`); }
  logAudit('demo', 'Injected reconciliation mismatch (' + kind + ')'); save(); render();
}

/* ---------- cases ---------- */
function openCase(kind, summary, ref){
  const c = {id:'C'+(S.seq.case++), ts:Date.now(), kind, summary, orderId:ref.orderId||null, status:'open'};
  const o = c.orderId && S.orders.find(x=>x.id===c.orderId); if(o) c.evidence = o.results;
  S.cases.unshift(c); logAudit('case', `${c.id} opened: ${kind}`, {orderId:c.orderId}); save();
}
function resolveCase(id, resolution){
  const c = S.cases.find(x=>x.id===id); if(!c) return;
  const note = ($('note-'+id)||{}).value || '';
  if(resolution==='Rule tuned' && !note.trim()){ toast('Add a note saying which rule you tuned and why'); return; }
  c.status='resolved'; c.resolution=resolution; c.note=note; c.resolvedAt=Date.now();
  logAudit('case', `${id} resolved: ${resolution}${note?' ('+note+')':''}`, {orderId:c.orderId});
  save(); render();
  if(resolution==='Approved' && c.orderId){ const o = S.orders.find(x=>x.id===c.orderId); if(o){ prefill = {sym:o.sym, side:o.side, type:o.type, qty:o.qty, limit:o.limit, thesis:o.thesisId}; setTab('trade'); toast('Ticket re-filled. Fix the cause, then re-run checks.'); } }
}

/* ---------- rule settings with cooldown ---------- */
function changeRule(id, field, value){
  const r = rule(id); const old = r[field];
  let looser = false;
  if(field==='param' && id!=='quiet') looser = (id==='wd_addr' || id==='wd_security') ? +value < +old : +value > +old;
  if(field==='param2' && (id==='signals' || id==='chain')) looser = +value > +old;
  if(field==='enabled') looser = !value;
  if(field==='mode') looser = value==='shadow';
  if(looser){
    S.pending.push({id:uuid(), ruleId:id, field, value, from:old, effective:Date.now()+DAY, ts:Date.now()});
    logAudit('settings', `Loosening ${r.name} ${field}: ${old} → ${value} queued (effective in 24h)`);
    toast('Loosening a control takes effect in 24 hours');
  } else {
    r[field] = field==='param'||field==='param2' ? +value : value;
    S.settingsChangedAt = Date.now();
    logAudit('settings', `${r.name} ${field}: ${old} → ${value} (immediate)`);
  }
  save(); render();
}
function applyPending(force){
  const now = Date.now(); let n=0;
  S.pending = S.pending.filter(p => { if(force || p.effective <= now){ const r = rule(p.ruleId); r[p.field] = (p.field==='param'||p.field==='param2')?+p.value:p.value; S.settingsChangedAt = now; logAudit('settings', `${r.name} ${p.field}: ${p.from} → ${p.value} now in effect${force?' (demo fast-forward)':''}`); n++; return false; } return true; });
  if(n){ save(); render(); }
}
function cancelPending(pid){ S.pending = S.pending.filter(p=>p.id!==pid); logAudit('settings','Queued change cancelled'); save(); render(); }

function wireTicket(){
  const f = $('ticket'); if(!f) return;

  const upd = () => { const q = M[f.sym.value]; f.limit.disabled = f.type.value==='market'; const p = f.type.value==='limit' && f.limit.value ? +f.limit.value : (f.side.value==='buy'?q.ask:q.bid); const n = (+f.qty.value||0)*p; $('est').textContent = 'Estimated value: ' + usd(n, 2); $('quotebox').innerHTML = quoteBox(); };
  f.sym.onchange = () => { fillTheses(); const q = M[f.sym.value]; f.limit.value = +(f.side.value==='buy'?q.ask:q.bid).toPrecision(6); upd(); };
  f.side.onchange = f.sym.onchange; f.type.onchange = upd; f.qty.oninput = upd; f.limit.oninput = upd;
  if(prefill){ f.sym.value = prefill.sym; f.side.value = prefill.side; f.type.value = prefill.type; f.qty.value = prefill.qty; fillTheses(); if(prefill.limit) f.limit.value = prefill.limit; if(prefill.thesis) f.thesis.value = prefill.thesis; prefill = null; upd(); }
  else { fillTheses(); const q = M[f.sym.value]; f.limit.value = +q.ask.toPrecision(6); upd(); }
}

const OFFICIAL_DOMAINS = ['binance.us','binance.com','robinhood.com','coinbase.com','kraken.com','gemini.com','metamask.io','ledger.com','trezor.io'];
const BRANDS = ['binance','robinhood','coinbase','kraken','gemini','metamask','ledger','trezor','paypal','usps','fedex','amazon'];

const SCAM_RULES = [

  {id:'remote', level:'critical', label:'Asks for remote access or an install', why:'Remote-access apps let a scammer control your device and accounts.',
   re:/\b(anydesk|teamviewer|remote access|screen ?share|share your screen|install (?:this|the) app|download (?:this|the) app|browser extension)\b/i},
  {id:'recovery', level:'critical', label:'Recovery or "release fee" scam', why:'Promises to get lost crypto back, or fees to "unlock" a withdrawal, are scams that target people who were already hit once.',
   re:/\b(recover (?:your )?(?:lost|stolen) (?:crypto|funds|coins|assets|money)|fund recovery|recovery (?:service|agent|expert)|upfront fee|fee upfront|release fee|unlock fee|pay (?:a )?(?:tax|fee) to withdraw|unclaimed (?:bitcoin|btc|crypto|funds|coins)|forgotten (?:bitcoin|btc|crypto|wallet)|dormant (?:wallet|account)|processing fee|get it (?:all )?back for)\b/i},
  {id:'giftcard', level:'critical', label:'Asks for payment in gift cards', why:'No exchange, bank or government agency takes gift cards. Anyone asking you to buy them is a scammer.',

   re:/\bsend (?:me |us )?\d+(?:\.\d+)? ?(?:btc|eth|usdt|sol|bitcoin|ether)\b[^.]{0,40}\b(?:send (?:you )?back|get (?:back )?\d|receive \d|double)/i},
  {id:'stranger', level:'warn', label:'New contact pushing an investment', why:'A new friend or match who steers you to a "special" platform is the classic setup for "pig butchering" scams.',

  {id:'notme', level:'warn', label:'"Wasn\'t you?" alert', why:'Fake security alerts say something happened on your account so you panic and use their link or number. Check inside the official app instead.',
   re:/\b(if (?:this|it) was not you|if (?:this|it) wasn'?t you|wasn'?t you\?|if you did(?: not|n'?t) (?:request|authori[sz]e|make)|not you\?)/i},
  {id:'urgent', level:'warn', label:'Pressure or threats', why:'Scammers create panic so you act before you think. Real notices let you check in the official app.',
   re:/\b(urgent(?:ly)?|immediately|right away|within (?:24|48|12) hours|act now|final (?:notice|warning)|suspend(?:ed)?|locked|frozen|will be (?:closed|terminated|deleted)|unusual activity|unauthori[sz]ed (?:login|access|withdrawal)|verify (?:now|your account|immediately))\b/i},
  {id:'toogood', level:'warn', label:'Too good to be true', why:'Guaranteed returns, giveaways and "send 1, get 2" offers are classic scams.',
   re:/\b(guaranteed|double your|2x your|risk[- ]free|100% (?:profit|return)|giveaway|free (?:btc|eth|crypto|usdt)|airdrop|claim your (?:reward|bonus)|send \d+(?:\.\d+)? (?:btc|eth|usdt)? ?(?:and|to) (?:get|receive)|\d+(?:\.\d+)?% (?:daily|a day|per day|every day|weekly|a week) (?:returns?|profits?|gains?|interest))\b/i},
  {id:'offplatform', level:'warn', label:'Moves you off official channels', why:'Real support stays in the official app or website. Scammers move you to WhatsApp, Telegram or a phone line they control.',

  {id:'impersonate', level:'info', label:'Claims to be a company or support team', why:'Anyone can say they are support. Check by opening the official app yourself, not by using the message.',

function scamNorm(s){ return s.toLowerCase().replace(/0/g,'o').replace(/1/g,'l').replace(/3/g,'e').replace(/5/g,'s').replace(/rn/g,'m').replace(/vv/g,'w'); }
function isOfficial(host){ return OFFICIAL_DOMAINS.some(d => host === d || host.endsWith('.' + d)); }
function analyzeMessage(text, sender){
  const findings = [];
  const add = (level, label, why, evidence) => findings.push({level, label, why, evidence});
  const saysDontShare = /\b(do not|don'?t|never) share\b/i.test(text);
  SCAM_RULES.forEach(r => { const m = text.match(r.re); if(!m) return;
    if(r.id==='secret' && saysDontShare) { add('info','Mentions a code, but says not to share it','Real login-code texts look like this. It only becomes a scam if someone then asks you for the code, or gives you a number to call.', m[0]); return; }
    add(r.level, r.label, r.why, m[0]); });
  const phone = (text.match(/(?:\+?\d[\d\s().-]{7,}\d)/g) || []).find(x => x.replace(/\D/g,'').length >= 9 && !/^\d{4,8}$/.test(x.trim()));

  raw.project.forEach((r,i) => push('project', i, r, r.project, 'event', r.title, null, DIR_MAP[r.impact], r.published));

function runDataChecks(){

    const dk = r.kind==='event' ? normText(r.text) : null;

    if(s.reliability < c.minRel){ r.status = 'low'; r.why = `Source reliability ${s.reliability} is below your bar of ${c.minRel}. Kept for context, not counted.`; return; }

    if(prices.length > 1){

    const rows = recs.filter(r => r.asset===sym);
    const use = rows.filter(counted);
    const price = use.filter(r => r.kind==='price').sort((a,b) => b.rel - a.rel)[0];
    const voters = use.filter(r => r.dir != null);
    let w = 0; voters.forEach(r => w += r.dir * (r.rel/100) * fresh(r));
    const dn = voters.filter(r => r.dir < 0).length, up = voters.filter(r => r.dir > 0).length;
    const inConflict = rows.some(r => r.status==='conflict');
    const label = inConflict ? ['Sources disagree','warn'] : (w <= -0.5 && dn >= 2) ? ['Risk elevated','block'] : w <= -0.3 ? ['Leaning negative','warn'] : (w >= 0.5 && up >= 2) ? ['Supportive','pass'] : w >= 0.3 ? ['Leaning positive','pass'] : ['Quiet','mutedc'];
    const srcCount = new Set(use.map(r=>r.src)).size;
    return {sym, rows, use, price, up, dn, flat: voters.length - up - dn, label, srcCount, held: rows.length - use.length, w};
  });
}

function setDataCfg(k, v){ const c = dataCfg(); c[k] = (k==='staleExch'||k==='badEth') ? !!v : +v; c.runAt = Date.now(); logAudit('data', `Data intake setting: ${({minRel:'minimum source reliability', tol:'price tolerance %', staleExch:'exchange feed stale', badEth:'aggregator bad ETH price'})[k]} → ${v}`); save(); render(); }
function rerunIntake(){ const c = dataCfg(); c.runAt = Date.now(); const {recs, conflicts} = runDataChecks(); const n = s => recs.filter(r=>r.status===s).length;
  logAudit('data', `Intake run: ${recs.length} records in, ${n('clean')+n('fixed')} counted, ${n('fixed')} standardized, ${n('duplicate')} duplicate, ${n('stale')} stale, ${n('missing')} missing fields, ${n('low')} below bar, ${conflicts.length} conflicts`); save(); render(); toast('Intake re-run'); }
function sendConflicts(){
  const c = dataCfg(); const {conflicts} = runDataChecks(); let k = 0;
  conflicts.filter(x => !x.auto && !c.sent.includes(x.key)).forEach(x => { openCase('Source conflict', x.text + ' Decide which source to trust, or wait for confirmation.', {}); c.sent.push(x.key); k++; });
  save(); render(); toast(k ? `${k} conflict${k>1?'s':''} sent to the review queue` : 'Nothing new to send');
}

/* ---------- risk signals (simulated third-party vendors) ---------- */
const VENDORS = [
  {id:'device',   name:'Device & login risk',          type:'Third-party vendor',    checks:'New devices, login locations, recent security changes', latency:140},
  {id:'identity', name:'Identity verification (KYC)',  type:'Third-party vendor',    checks:'Whether the account holder is verified and still matches', latency:210},
  {id:'chain',    name:'Blockchain analytics',         type:'Third-party vendor',    checks:'Links between your wallets and sanctioned or high-risk addresses', latency:180},
  {id:'scam',     name:'Scam check',                   type:'Internal (SignalDesk)', checks:'Whether you recently got a message flagged as a likely scam', latency:5}
];
const SIGNAL_EVENTS = [
  {id:'newDevice',   vendor:'device',   pts:30, label:'Login from a new device'},
  {id:'newLocation', vendor:'device',   pts:25, label:'Login from a new location'},
  {id:'recent2fa',   vendor:'device',   pts:30, label:'2FA or password changed in the last 24 hours'},
  {id:'emailChange', vendor:'device',   pts:20, label:'Email address changed in the last 24 hours'},
  {id:'kycPending',  vendor:'identity', pts:50, label:'Identity re-verification pending'},
  {id:'mixer',       vendor:'chain',    pts:35, label:'A linked wallet received funds from a mixing service'},
  {id:'riskyWallet', vendor:'chain',    pts:60, label:'A linked wallet has exposure to a high-risk address'},
  {id:'sanctioned',  vendor:'chain',    pts:100, label:'A deposit traces back to a sanctioned address'}
];
function defaultSignals(){ const now = Date.now(); return {vendors:{device:{status:'healthy',mode:'closed',updated:now}, identity:{status:'healthy',mode:'closed',updated:now}, chain:{status:'healthy',mode:'closed',updated:now}, scam:{status:'healthy',mode:'open',updated:now}}, events:{}, alerted:false}; }
function vendorName(id){ return (VENDORS.find(v=>v.id===id)||{}).name || id; }
function vendorScore(id){
  let s = {device:8, identity:5, chain:0, scam:0}[id] || 0;
  SIGNAL_EVENTS.filter(e => e.vendor===id && S.signals.events[e.id]).forEach(e => s += e.pts);
  if(id==='scam' && (S.scamChecks||[]).some(c => c.cls==='block' && c.ts > Date.now()-DAY)) s = 25;
  return Math.min(100, s);
}
function signalSummary(){
  const live = VENDORS.filter(v => S.signals.vendors[v.id].status !== 'down');
  const scores = live.map(v => ({v, s:vendorScore(v.id)}));
  const top = scores.reduce((m,x) => Math.max(m, x.s), 0);
  const extra = scores.filter(x => x.s >= 20).length > 1 ? 10 : 0;  // several sources agreeing = more confidence
  const down = VENDORS.filter(v => S.signals.vendors[v.id].status === 'down');
  return {score:Math.min(100, top + extra), scores, down};
}
function signalBand(score){ const r = rule('signals'); if(!r) return ['Low','pass']; return score >= r.param ? ['High','block'] : score >= r.param2 ? ['Elevated','warn'] : ['Low','pass']; }
function ago(ts){ const s = Math.max(0, Math.round((Date.now()-ts)/1000)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s/60)}m ago` : `${Math.floor(s/3600)}h ago`; }
function afterSignalsChange(){
  const r = rule('signals'); const sum = signalSummary();
  if(r && sum.score >= r.param && !S.signals.alerted){ S.signals.alerted = true; recordAnomaly('High account risk from outside signals', `Account risk ${sum.score}/100. New orders are blocked until it drops.`); }
  if(r && sum.score < r.param) S.signals.alerted = false;
  save(); render();
}
function setVendor(id, field, val){
  const v = S.signals.vendors[id]; const old = v[field]; if(old === val) return;
  v[field] = val; if(field==='status' && val!=='down') v.updated = Date.now();
  logAudit('signals', `${vendorName(id)}: ${field==='mode'?'if down':field} ${old} → ${val}`);
  if(field==='status' && val==='down') recordAnomaly(`${vendorName(id)} is down`, v.mode==='closed' ? 'Fail-closed: new orders are blocked until it recovers.' : 'Fail-open: orders continue without this signal, and each one is logged.');
  afterSignalsChange();
}
function toggleSignalEvent(id){ S.signals.events[id] = !S.signals.events[id]; if(S.signals.events[id] && ['newDevice','recent2fa','emailChange'].includes(id)) S.signals.changedAt = Date.now(); logAudit('signals', `${SIGNAL_EVENTS.find(e=>e.id===id).label}: ${S.signals.events[id]?'on':'off'}`); afterSignalsChange(); }
function simulateTakeover(){ S.signals.changedAt = Date.now(); ['newDevice','newLocation','recent2fa'].forEach(k => S.signals.events[k] = true); logAudit('signals','Simulated account-takeover signals (new device, new location, 2FA change)'); afterSignalsChange(); toast('Takeover signals on. Try placing an order.'); }
function clearSignals(){ const keep = S.signals.vendors; S.signals = defaultSignals(); Object.keys(keep).forEach(k => S.signals.vendors[k].mode = keep[k].mode); logAudit('signals','All signals cleared and vendors set healthy'); afterSignalsChange(); }
function viewSignals(){
  const r = rule('signals'); const sum = signalSummary(); const [band, cls] = signalBand(sum.score);
  const closedDown = sum.down.filter(v => S.signals.vendors[v.id].mode==='closed'), openDown = sum.down.filter(v => S.signals.vendors[v.id].mode==='open');
  const decision = !r || !r.enabled ? ['Signals rule is off','mutedc'] : closedDown.length ? ['Orders blocked: a fail-closed vendor is down','block'] : cls==='block' ? ['Orders blocked: account risk is high','block'] : cls==='warn' ? ['Orders need extra confirmation','warn'] : ['Orders allowed','pass'];
  const drivers = [];
  SIGNAL_EVENTS.filter(e => S.signals.events[e.id]).forEach(e => drivers.push(`${e.label} (+${e.pts}, from ${vendorName(e.vendor)})`));
  if(vendorScore('scam') > 0) drivers.push('A message you checked recently was flagged as a likely scam (from Scam check)');
  closedDown.forEach(v => drivers.push(`${v.name} is down and set to fail-closed`));
  openDown.forEach(v => drivers.push(`${v.name} is down; continuing without it (fail-open)`));
  const rows = VENDORS.map(v => { const st = S.signals.vendors[v.id]; const sc = st.status==='down' ? null : vendorScore(v.id);
    return `<tr>
      <td><b>${esc(v.name)}</b><div class="small muted">${esc(v.type)}</div></td>
      <td class="small">${esc(v.checks)}</td>
      <td><select onchange="setVendor('${v.id}','status',this.value)">${['healthy','slow','down'].map(s=>`<option value="${s}" ${st.status===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></td>
      <td class="num mono">${st.status==='down' ? '–' : (st.status==='slow' ? '2,400 ms' : v.latency + ' ms')}</td>
      <td class="small"><span class="fresh" data-v="${v.id}">${ago(st.updated)}</span></td>
      <td class="num">${sc==null ? '<span class="chip block">no data</span>' : `<span class="scorebar"><i style="width:${sc}%;background:${sc>=(r?r.param:70)?'var(--bad)':sc>=(r?r.param2:40)?'var(--warn)':'var(--accent)'}"></i></span><b>${sc}</b>`}</td>
      <td><select onchange="setVendor('${v.id}','mode',this.value)"><option value="closed" ${st.mode==='closed'?'selected':''}>Fail-closed (block)</option><option value="open" ${st.mode==='open'?'selected':''}>Fail-open (allow + log)</option></select></td></tr>`; }).join('');
  return `<h2>Risk signals</h2><p class="sub">Outside risk signals feed into every order decision, alongside the rules. These vendors are simulated, to show how signals, outages and thresholds work together.</p>
  <div class="grid2">
    <div class="panel"><h3>Account risk right now</h3>
      <div class="row" style="align-items:baseline"><span style="font-size:40px;font-weight:700">${sum.score}</span><span class="muted">/ 100</span><span class="chip ${cls}" style="font-size:13px">${band}</span></div>
      <div style="margin:8px 0"><span class="chip ${decision[1]}">${decision[0]}</span></div>
      <div class="small muted">Warn at ${r?r.param2:40}, block at ${r?r.param:70}. Change these on <a href="#rules">Risk rules</a>.</div>
      <h3 style="margin-top:14px">What's driving it</h3>${drivers.length ? `<ul class="small" style="margin:0;padding-left:18px">${drivers.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>` : '<div class="small muted">Nothing unusual. Baseline signals only.</div>'}
    </div>

      ${SIGNAL_EVENTS.map(e=>`<label class="check small" style="margin:6px 0"><input type="checkbox" ${S.signals.events[e.id]?'checked':''} onchange="toggleSignalEvent('${e.id}')"> <span>${esc(e.label)} <span class="muted">+${e.pts}, ${esc(vendorName(e.vendor))}</span></span></label>`).join('')}
      <div class="row" style="margin-top:10px"><button class="btn sm" onclick="simulateTakeover()">Simulate account takeover</button><button class="btn sm" onclick="clearSignals()">Clear all signals</button></div>
    </div>
  </div>
  <div class="panel" style="overflow-x:auto"><h3>Signal sources</h3>
    <table><tr><th>Source</th><th>What it checks</th><th>Status</th><th class="num">Response time</th><th>Last update</th><th class="num">Score</th><th>If it's down</th></tr>${rows}</table>
    <p class="small muted" style="margin-bottom:0">Fail-closed blocks orders when a source is down: safer, but more friction. Fail-open lets orders through without that signal and logs each one: smoother, but riskier. The choice is made per source, before an outage, not during one.</p></div>`;
}

function viewRules(){
  const rows = S.rules.map(r => `<tr><td><b>${esc(r.name)}</b><div class="small muted">${esc(r.desc||r.unit||'')}</div></td><td><span class="chip mutedc">${r.cat}</span></td>

  <p class="small muted">"Last 50 checks" counts how often each rule warned or blocked, including shadow results. Use it with resolved cases to judge false positives before you enforce a rule.</p>`;

function ruleStats(id){
  const recent = S.orders.slice(0,50).concat((S.transfers||[]).slice(0,50)).filter(o=>o.results);
  let w=0,b=0,s=0; recent.forEach(o => { const r = o.results.find(x=>x.id===id); if(!r) return; if(r.shadow) s++; else if(r.outcome==='warn') w++; else if(r.outcome==='block') b++; });
  return recent.length ? `${b} block, ${w} warn${s?`, ${s} shadow`:''}` : '<span class="muted">no checks yet</span>';
}
